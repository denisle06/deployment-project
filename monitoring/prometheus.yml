# Scrapes the prod EC2 over the private VPC network.
# Replace PROD_PRIVATE_IP (two places) with the prod instance's private IPv4 address.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics: CPU, memory, disk, network (Node Exporter, port 9100).
  - job_name: prod-node
    static_configs:
      - targets: ["PROD_PRIVATE_IP:9100"]
        labels: { env: prod }

  # Container metrics: stable vs canary (cAdvisor, port 8080).
  - job_name: prod-containers
    static_configs:
      - targets: ["PROD_PRIVATE_IP:8080"]
        labels: { env: prod }
