# Scrapes the prod EC2 over the private VPC network.
# prod EC2 private IPv4: 172.31.15.217 (change here if prod is re-created).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics: CPU, memory, disk, network (Node Exporter, port 9100).
  - job_name: prod-node
    static_configs:
      - targets: ["172.31.15.217:9100"]
        labels: { env: prod }

  # Container metrics: stable vs canary (cAdvisor, port 8080).
  - job_name: prod-containers
    static_configs:
      - targets: ["172.31.15.217:8080"]
        labels: { env: prod }
