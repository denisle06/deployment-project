# Public entry point on the prod EC2. The upstream "smarttunes_app" (stable/canary
# weights) lives in smarttunes-upstream.conf, rewritten by scripts/common.sh.

# Each line records which container answered and its build version: canary evidence.
log_format smarttunes '$remote_addr [$time_local] "$request" $status '
                      'upstream=$upstream_addr version=$upstream_http_x_app_version '
                      'rt=$request_time';

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 40m;   # recording uploads (app limit is 32 MB)
    access_log /var/log/nginx/smarttunes.access.log smarttunes;

    location / {
        proxy_pass http://smarttunes_app;
        # Do not silently retry a failed request on the other version:
        # canary errors must reach the probes instead of being hidden.
        proxy_next_upstream off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
