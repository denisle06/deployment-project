; Recording uploads are capped at 32 MB by the app; leave headroom here.
upload_max_filesize = 40M
post_max_size = 40M
memory_limit = 256M
max_execution_time = 300
expose_php = Off

; Sessions live on a Docker volume shared by the stable and canary containers,
; so a logged-in user stays logged in whichever version serves the request.
session.save_path = "/var/lib/php/sessions"
