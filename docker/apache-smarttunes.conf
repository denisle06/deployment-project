ServerName localhost
ServerTokens Prod
ServerSignature Off

# The app relies on .htaccess for URL routing and for denying access to
# app/ (code + config) and .env files, so overrides must be allowed.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Lets canary probes and testers see which build answered a request.
Header always set X-App-Version "${APP_VERSION}"
